[project]
name = "querypilot"
version = "0.1.0"
description = "A measurable Text2SQL baseline and safe SQLite execution foundation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlglot>=26,<30",
  "openai>=1.60,<3",
  "langgraph>=1,<2",
  # 检索 tool 直接导入它，所以声明为直接依赖。
  "langchain-core>=1,<2",
  # 查询图编译时和用户端启动时用 langsmith.configure 关闭追踪，所以声明为直接依赖。
  "langsmith>=0.14,<1",
]

[project.scripts]
querypilot = "querypilot.entrypoints.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
knowledge = [
    "jieba==0.42.1",
    "psycopg[binary]>=3.3.6,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/querypilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
