[project]
name = "querypilot"
version = "0.1.0"
description = "A measurable Text2SQL baseline and safe SQLite execution foundation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlglot>=26,<30",
  "openai>=1.60,<3",
  "langgraph>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/querypilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
